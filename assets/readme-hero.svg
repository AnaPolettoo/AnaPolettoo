<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Hi, I'm Ana Poletto</title>
  <desc id="heroDesc">Portfolio-inspired hero card with a short introduction to Ana Poletto.</desc>
  <defs>
    <linearGradient id="bgPanel" x1="50" y1="40" x2="1220" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15151A"/>
      <stop offset="1" stop-color="#0F1015"/>
    </linearGradient>
    <linearGradient id="bgStroke" x1="40" y1="30" x2="1240" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2A34"/>
      <stop offset="1" stop-color="#1B1C24"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="190" y1="118" x2="430" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C5DF"/>
      <stop offset="1" stop-color="#EDA0C8"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="880" y1="170" x2="1170" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FB1FF"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <filter id="softBlurPink" x="90" y="80" width="340" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="42" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="softBlurBlue" x="840" y="150" width="320" height="250" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="38" result="effect1_foregroundBlur"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="#09090C"/>
  <rect x="24" y="24" width="1232" height="512" rx="36" fill="url(#bgPanel)" stroke="url(#bgStroke)"/>

  <g filter="url(#softBlurPink)" opacity="0.7">
    <circle cx="260" cy="190" r="76" fill="url(#pinkGlow)"/>
  </g>
  <g filter="url(#softBlurBlue)" opacity="0.48">
    <circle cx="1000" cy="270" r="70" fill="url(#blueGlow)"/>
  </g>

  <rect x="72" y="88" width="1050" height="320" rx="28" fill="#111218" stroke="#20222D"/>

  <text x="118" y="196" fill="#F8F8FB" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="700" letter-spacing="-2.4">Hi, I'm Ana</text>
  <rect x="598" y="138" width="4" height="74" rx="2" fill="#EDA0C8"/>

  <text x="118" y="270" fill="#D8D8E2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">I'm a Data Science &amp; AI student at PUCRS and an iOS Developer</text>
  <text x="118" y="312" fill="#D8D8E2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">at the Apple Developer Academy. I build products with clarity,</text>
  <text x="118" y="354" fill="#8E8E9B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400">personality, and a strong focus on meaningful user experiences.</text>

  <rect x="118" y="434" width="202" height="42" rx="21" fill="#171821" stroke="#2A2C38"/>
  <text x="153" y="460" fill="#F4F4F7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Open portfolio</text>

  <text x="1040" y="470" fill="#7D7D8A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" text-anchor="end">A preview of my portfolio</text>
</svg>
