<svg width="1280" height="270" viewBox="0 0 1280 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sinaluTitle sinaluDesc">
  <title id="sinaluTitle">SinaLu</title>
  <desc id="sinaluDesc">Project preview card for SinaLu.</desc>
  <defs>
    <linearGradient id="sinaluPanel" x1="50" y1="30" x2="1230" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15161C"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <linearGradient id="sinaluStroke" x1="48" y1="28" x2="1232" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2E3A"/>
      <stop offset="1" stop-color="#1A1E28"/>
    </linearGradient>
    <filter id="sinaluBlur" x="930" y="35" width="230" height="200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="26" result="effect1_foregroundBlur"/>
    </filter>
  </defs>

  <rect width="1280" height="270" fill="#09090C"/>
  <rect x="24" y="24" width="1232" height="222" rx="32" fill="url(#sinaluPanel)" stroke="url(#sinaluStroke)"/>
  <g filter="url(#sinaluBlur)" opacity="0.42">
    <circle cx="1048" cy="132" r="54" fill="#5B8DEF"/>
  </g>

  <rect x="72" y="72" width="122" height="34" rx="17" fill="#171821" stroke="#2B2F3D"/>
  <text x="102" y="94" fill="#AAB1C1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">LATEST / 01</text>

  <text x="72" y="148" fill="#7FB1FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.4">SinaLu</text>
  <text x="72" y="186" fill="#D8D8E2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="500">An educational app for learning Libras in a fun, interactive,</text>
  <text x="72" y="220" fill="#8E8E9B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400">and accessible way.</text>

  <rect x="1018" y="74" width="150" height="122" rx="30" fill="#5B8DEF"/>
  <text x="1062" y="149" fill="#09101D" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-1.6">SL</text>

  <text x="1168" y="220" fill="#DDE7FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" text-anchor="end">Open on portfolio →</text>
