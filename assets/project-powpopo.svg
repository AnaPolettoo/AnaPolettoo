<svg width="1280" height="210" viewBox="0 0 1280 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="powTitle powDesc">
  <title id="powTitle">Pow Po Po</title>
  <desc id="powDesc">Project preview card for Pow Po Po.</desc>
  <defs>
    <linearGradient id="powPanel" x1="48" y1="20" x2="1234" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15161C"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <filter id="powBlur" x="936" y="14" width="220" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="28" result="effect1_foregroundBlur"/>
    </filter>
  </defs>

  <rect x="40" y="16" width="1200" height="178" rx="30" fill="url(#powPanel)"/>
  <g filter="url(#powBlur)" opacity="0.18">
    <circle cx="1046" cy="112" r="42" fill="#FF6B35"/>
  </g>

  <text x="82" y="98" fill="#FF6B35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="-1.3">Pow Po Po</text>
  <text x="82" y="136" fill="#D8D8E2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500">A one-finger survival game with playful chaos, fast runs,</text>
  <text x="82" y="168" fill="#8E8E9B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="400">and strategic upgrades.</text>
</svg>
